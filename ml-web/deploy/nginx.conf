# 知堂运营后台（ml-web）的 nginx 配置
#
# 用法：与 dist/ 一起挂进 nginx 容器，见同目录 README.md
#
# 职责有两个：
#   1. 提供 dist/ 静态文件
#   2. 把 /xxx-server/ 开头的接口反向代理到网关，避免浏览器跨域

server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 50m;

    root  /usr/share/nginx/html;
    index index.html;

    # 前端用的是 hash 路由（#/notices），静态资源找不到时回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 网关地址。容器用 --network host 启动，所以 127.0.0.1 就是宿主机
    set $gateway http://127.0.0.1:24101;

    location /user-server/   { proxy_pass $gateway; }
    location /course-server/ { proxy_pass $gateway; }
    location /sale-server/   { proxy_pass $gateway; }
    location /order-server/  { proxy_pass $gateway; }
    location /agent-server/  { proxy_pass $gateway; }

    # 代理通用头：网关的 TokenGlobalFilter 需要读到原始请求头（尤其是 token）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 小精灵问答要串几轮大模型工具调用，响应慢，超时给足
    proxy_connect_timeout 5s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # 静态资源缓存：带 hash 的 js/css 可以长缓存，index.html 不缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
